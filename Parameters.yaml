# ==========================================
# ROTA DO ÓLEO - CONFIGURAÇÕES DO PROJETO
# ==========================================

project:
  name: "Rota do Óleo"
  version: "1.0.0"
  description: "Sistema de agrupamento e otimização de rotas de coleta de óleo"

# ==========================================
# CONFIGURAÇÕES DE ENTRADA
# ==========================================

input:
  file: "./dataset/clientes.csv"
  format: "csv"
  encoding: "utf-8"
  separator: ","
  required_columns:
    - "ordem"
    - "código"
    - "cliente"
    - "LAT"
    - "LON"

  max_clients: 70

  coordinates:
    latitude_column: "LAT"
    longitude_column: "LON"
    latitude_min: -90
    latitude_max: 90
    longitude_min: -180
    longitude_max: 180

# ==========================================
# GEOCODIFICAÇÃO
# ==========================================

geocoding:
  enabled: true
  provider: "nominatim"
  country: "Brazil"
  region: "Paraná"
  user_agent: "rota_do_oleo"
  timeout: 10
  retry_attempts: 3
  cache_results: true

# ==========================================
# AGRUPAMENTO K-MEANS
# ==========================================

clustering:
  algorithm: "kmeans"

  # Quantidade de grupos
  n_clusters: 5

  random_state: 42
  n_init: 10
  max_iter: 300

  # Colunas utilizadas no agrupamento
  features:
    - "LAT"
    - "LON"

# ==========================================
# OTIMIZAÇÃO DE ROTAS
# ==========================================

routing:
  algorithm: "knn"

  # Critério para escolher o ponto inicial
  start_point: "highest_latitude"

  # Colunas de coordenadas
  latitude_column: "LAT"
  longitude_column: "LON"

  # Retornar ao ponto inicial após o último cliente
  return_to_start: false

# ==========================================
# ARQUIVOS DE SAÍDA
# ==========================================

output:
  directory: "./output"

  save_clusters: true
  clusters_directory: "./output/grupos"

  save_routes: true
  routes_directory: "./output/rotas"

  save_graphs: true
  graphs_directory: "./output/graficos"

  file_format: "csv"
  encoding: "utf-8"

  # Gerar arquivos separados para cada grupo
  separate_cluster_files: true

  # Gerar arquivo com a rota final
  save_final_route: true

# ==========================================
# VISUALIZAÇÃO
# ==========================================

visualization:
  enabled: true
  show_clusters: true
  show_routes: true
  show_labels: true

  graph_format: "png"
  figure_size:
    width: 12
    height: 8

# ==========================================
# VALIDAÇÃO DOS DADOS
# ==========================================

validation:
  check_missing_values: true
  check_duplicate_clients: true
  check_invalid_coordinates: true
  require_coordinates: true

  # Interromper execução caso haja erros
  stop_on_error: true

# ==========================================
# LOGS
# ==========================================

logging:
  enabled: true
  level: "INFO"
  file: "./output/rota_do_oleo.log"