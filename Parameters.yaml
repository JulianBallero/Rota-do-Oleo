project:
  name: "Rota do Óleo"
  version: "1.1.0"
  description: "Agrupamento geográfico de clientes e geração de rotas aproximadas"

input:
  file: "dataset/clientes-com-coordenadas.csv"
  format: "csv"
  encoding: "utf-8-sig"
  separator: ","
  max_clients: 10000

geocoding:
  enabled: false
  provider: "nominatim"
  input_file: "dataset/clientes.csv"
  address_column: "endereco"
  country: "Brazil"
  region: "Paraná"
  user_agent: "rota_do_oleo_app"
  timeout: 10
  retry_attempts: 2

clustering:
  algorithm: "kmeans"
  auto_clusters: true
  min_clusters: 20
  max_clusters: 20
  n_clusters: 20
  random_state: 42
  n_init: 10
  max_iter: 300
  latitude_column: "latitude"
  longitude_column: "longitude"

routing:
  algorithm: "nearest_neighbor_haversine"
  start_point: "highest_latitude"
  latitude_column: "latitude"
  longitude_column: "longitude"
  return_to_start: false

output:
  directory: "output"
  clusters_directory: "output/grupos"
  routes_directory: "output/rotas"
  graphs_directory: "output/graficos"

logging:
  level: "INFO"
